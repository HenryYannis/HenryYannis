name: Generate Snake Animation

on:
  schedule:
    # 每天 UTC 0 点（北京时间 8:00）自动运行刷新
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # 生成小宝科技站主题色（科技蓝 #3b82f6 + 创新紫 #8b5cf6）贪吃蛇动画
      - name: generate-snake-game-from-github-contribution-grid
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#8b5cf6&color_dots=#ebedf0,#bfdbfe,#60a5fa,#3b82f6,#1d4ed8
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#a855f7&color_dots=#161b22,#1e3a8a,#2563eb,#3b82f6,#60a5fa

      # 推送到 output 分支
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
