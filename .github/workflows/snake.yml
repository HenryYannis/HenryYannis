name: Generate Snake Animation

on:
  schedule:
    # 每天 UTC 0 点自动运行刷新
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

# 默认不给 token 任何权限，只在需要的 job 里单独放开
permissions: {}

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # 生成科技蓝蛇身、原版绿色格子的贪吃蛇动画（浅色 + 深色两版）
      - name: generate-snake-game-from-github-contribution-grid
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#3b82f6
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#3b82f6

      # 推送到 output 分支
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
